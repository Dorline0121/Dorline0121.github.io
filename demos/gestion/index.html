<body class="bg-gradient-login" style="background-image: url('goran-ivos-iacpoKgpBAM-unsplash.jpg');">
<!-- Login Content -->
<div class="container-login">
<div class="row justify-content-center">
<div class="col-xl-10 col-lg-12 col-md-9">
<div class="card shadow-sm my-5">
<div class="card-body p-0">
<div class="row">
<div class="col-lg-12">
<div class="login-form">
<h5 align="center">STUDENT FORMATION SYSTEM</h5>
<div class="text-center">
<img src="images1.png" style="width:100px;height:50px"/>
<br/><br/>
<h1 class="h4 text-gray-900 mb-4">Login Panel</h1>
</div>
<form action="index.html" class="user" method="Post">
<div class="form-group">
<select class="form-control mb-3" name="userType" required="">
<option value="">--Select User Roles--</option>
<option value="Administrator">Administrator</option>
<option value="ClassTeacher">ClassTeacher</option>
</select>
</div>
<div class="form-group">
<input class="form-control" id="exampleInputEmail" name="username" placeholder="Enter Email Address" required="" type="text"/>
</div>
<div class="form-group">
<input class="form-control" id="exampleInputPassword" name="password" placeholder="Enter Password" required="" type="password"/>
</div>
<div class="form-group">
<div class="custom-control custom-checkbox small" style="line-height: 1.5rem;">
<input class="custom-control-input" id="customCheck" type="checkbox"/>
<!-- <label class="custom-control-label" for="customCheck">Remember
                          Me</label> -->
</div>
</div>
<div class="form-group">
<input class="btn btn-success btn-block" name="login" type="submit" value="Login"/>
</div>
<div class="register-link">
<p>You don't have an account ?</p>
<a href="formulaire/index.html">Register</a>
</div>
</form>
