<!DOCTYPE html>

<html lang="fr">
<head>
<script src="../demo-shim.js"></script><meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="styles.css" rel="stylesheet"/>
<link href="../vendor/fontawesome6/css/all.min.css" rel="stylesheet"/>
<title>Inscription - Gestion Utilisateurs</title>
</head>
<body>
<div class="container">
<h2>Inscription</h2>
<form action="submit.html" id="registrationForm" method="POST">
<div class="form-group">
<label for="name">Nom:</label>
<i class="fas fa-user icon"></i>
<input id="name" name="name" placeholder="Votre nom" required="" type="text"/>
</div>
<div class="form-group">
<label for="email">Email:</label>
<i class="fas fa-envelope icon"></i>
<input id="email" name="email" placeholder="Votre email" required="" type="email"/>
</div>
<div class="form-group">
<label for="password">Mot de passe:</label>
<i class="fas fa-lock icon"></i>
<input id="password" minlength="6" name="password" placeholder="Votre mot de passe" required="" type="password"/>
<label>Confirmer le mot de passe</label><br/>
<input class="form-control" name="confirm" placeholder="Confirmation" type="password"/><br/>
</div>
<div class="form-group">
<label for="role">Role:</label>
<i class="fas fa-envelope icon"></i>
<input id="role" name="role" placeholder="Votre role" required="" type="role"/>
</div>
<button type="submit">Register</button>
<div id="message"></div>
<button class="btn btn-theme btn-block" onclick="window.location.href='index1.php'" type="reset"><i class="fa fa-back"></i> return</button>
</form>
</div>
<script src="script.js"></script>
</body>
</html>
